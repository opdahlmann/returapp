# returapp.no bak Traefik (TLS avsluttes der). Rene adresser (/funksjoner → funksjoner.html), egen 404, www → apex.
# Cache-regel per sti (første treff vinner), satt én gang på server-nivå som i infra/web/nginx.conf.
map $uri $cache_control {
    ~^/_astro/                       "public, max-age=31536000, immutable";
    ~^/demo/app(\.html)?$           "no-cache";
    ~*\.(?:png|webp|svg|woff2|ico)$  "public, max-age=2592000";
    default                          "no-cache";
}
# Selve demo-filen skal ikke indekseres (siden /demo skal). Tom verdi = headeren sendes ikke. try_files gjør $uri om til /demo/app.html.
map $uri $robots_tag {
    ~^/demo/app(\.html)?$  "noindex";
    default       "";
}
# CSP: ingen sporing, ingen eksterne domener. unsafe-inline for skript: Astros inline-skript, tema-skriptet og JSON-LD.
# Demo-dokumentet (og bare det) er designprototypen: den pakker React, runtime og fonter ut til blob:-adresser og lager komponenten
# med new Function, derfor blob: og unsafe-eval der. Den åpner i egen fane, så frame-ancestors 'none' er riktig for den.
map $uri $csp {
    ~^/demo/app(\.html)?$  "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    default                 "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80;
    server_name www.returapp.no;
    return 301 https://returapp.no$request_uri;
}

server {
    listen 80 default_server;
    server_name returapp.no dev.returapp.no _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;                     # relative Location, så 301 blir https bak Traefik

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    add_header Cache-Control $cache_control;
    add_header X-Robots-Tag $robots_tag;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp always;

    # Én adresse per side: /index.html → /, /kontakt.html → /kontakt, /kontakt/ → /kontakt
    location ~ ^/(.*/)?index\.html$ { return 301 /$1; }
    location ~ ^/(.+)\.html$ { return 301 /$1; }
    location ~ ^/(.+)/$ { return 301 /$1; }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
