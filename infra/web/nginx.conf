server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker-DNS, slås opp per request
    client_max_body_size 10m;                  # bildeopplasting (nginx-standard er 1 MB)

    # Komprimering (JS/CSS/JSON ~70 % mindre). Traefik komprimerer ikke av seg selv.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain text/csv;

    location ^~ /api/ {
        set $api_upstream ${API_UPSTREAM};     # variabel → nginx starter selv om API-et er nede
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        # Traefik har allerede satt klient-IP og https – send verdiene videre uendret (én hop for API-et).
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # add_header arves ikke inn i location-blokker som har egne add_header – derfor gjentas sikkerhetsheaderne i hver.
    # Service worker og index må alltid sjekkes på nytt, ellers henger gamle versjoner igjen.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # nettleseren ignorerer den over http (lokalt)
    }
    location ~ ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # nettleseren ignorerer den over http (lokalt)
    }
    location ~* \.(?:js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # nettleseren ignorerer den over http (lokalt)
        try_files $uri =404;
    }
    location / {
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # nettleseren ignorerer den over http (lokalt)
        try_files $uri $uri/ /index.html;       # SPA-fallback (dype lenker som /p/R-2041)
    }
}
