name: CI

on:
  push:
    branches: [main, opd]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet build backend
      # Testene bruker den ene dev-databasen (ingen testdatabaser). Krever repo-secrets MONGO_CONNECTION_STRING og MONGO_DATABASE.
      - name: dotnet test
        env:
          Mongo__ConnectionString: ${{ secrets.MONGO_CONNECTION_STRING }}
          Mongo__Database: ${{ secrets.MONGO_DATABASE }}
        run: |
          if [ -z "$Mongo__ConnectionString" ]; then echo "::warning::MONGO_CONNECTION_STRING mangler – backend-tester hoppes over"; exit 0; fi
          export Jwt__Secret=$(openssl rand -hex 32)
          dotnet test backend --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Bygger begge images og kjører Playwright (chromium + webkit) mot containerne – slik de kjører i Dokploy, men med
  # dev-endepunkter og demo-data på. Ingen compose og ingen Mongo-container: API-et bruker den ene dev-databasen.
  # needs: backend, så backend-testene og e2e ikke skriver til dev-databasen samtidig.
  e2e:
    runs-on: ubuntu-latest
    needs: backend
    env:
      Mongo__ConnectionString: ${{ secrets.MONGO_CONNECTION_STRING }}
      Mongo__Database: ${{ secrets.MONGO_DATABASE }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/api/Dockerfile -t returapp-api .
      - run: docker build -f infra/web/Dockerfile -t returapp-web .
      - name: Start API (read-only) og web på felles docker-nettverk
        run: |
          if [ -z "$Mongo__ConnectionString" ]; then echo "::warning::MONGO_CONNECTION_STRING mangler – e2e hoppes over"; echo "SKIP_E2E=1" >> "$GITHUB_ENV"; exit 0; fi
          docker network create returapp-net
          docker run -d --name api --network returapp-net --read-only --tmpfs /tmp -p 8088:8080 \
            -e Mongo__ConnectionString -e Mongo__Database -e Jwt__Secret="$(openssl rand -hex 32)" \
            -e App__SeedDemo=true -e App__DevEndpoints=true -e App__BaseUrl=http://localhost:8080 -e App__AuthRateLimitPerMinute=1000 -e App__Geocode=false \
            -e Sms__Provider=Console -e Mail__Provider=Console -e Push__Provider=Console \
            returapp-api
          docker run -d --name web --network returapp-net -p 8080:80 -e API_UPSTREAM=http://api:8080 returapp-web
          for i in $(seq 1 60); do curl -sf http://localhost:8088/ready && exit 0; sleep 2; done
          docker logs api; exit 1
      - uses: actions/setup-node@v4
        if: env.SKIP_E2E != '1'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright
        if: env.SKIP_E2E != '1'
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_API_URL: http://localhost:8088
          E2E_WEBKIT: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          npx playwright test
      - name: API-logg ved feil
        if: failure() && env.SKIP_E2E != '1'
        run: docker logs api
      - uses: actions/upload-artifact@v4
        if: always() && env.SKIP_E2E != '1'
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
