name: CI

on:
  push:
    branches: [main, opd]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet build backend
      # Testene bruker den ene dev-databasen (ingen testdatabaser). Krever repo-secrets MONGO_CONNECTION_STRING og MONGO_DATABASE.
      - name: dotnet test
        env:
          Mongo__ConnectionString: ${{ secrets.MONGO_CONNECTION_STRING }}
          Mongo__Database: ${{ secrets.MONGO_DATABASE }}
        run: |
          if [ -z "$Mongo__ConnectionString" ]; then echo "::warning::MONGO_CONNECTION_STRING mangler – backend-tester hoppes over"; exit 0; fi
          export Jwt__Secret=$(openssl rand -hex 32)
          dotnet test backend --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/api/Dockerfile -t returapp-api .
      - run: docker build -f infra/web/Dockerfile -t returapp-web .
